[workspace]
members = ["crates/terminal-protocol", "crates/terminal-pty", "crates/terminal-host"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Host Terminal contributors"]

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
crossbeam-channel = "0.5.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
portable-pty = "0.9.0"
uuid = { version = "1.18.1", features = ["v4"] }
libc = "0.2.177"
terminal-protocol = { path = "crates/terminal-protocol", version = "0.2.0" }
terminal-pty = { path = "crates/terminal-pty", version = "0.2.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

